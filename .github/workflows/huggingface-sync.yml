name: Sync Cosmos UX Design dataset

on:
  push:
    paths:
      - "AGENTS.md"
      - "Accordion.md"
      - "Affordances, Signifiers and Design Conventions.md"
      - "Alternatives to Deceptive Patterns.md"
      - "Anchors and Links.md"
      - "Authentication.md"
      - "Badge.md"
      - "Baskets and Checkout.md"
      - "Breadcrumbs.md"
      - "Calendars and Date Pickers.md"
      - "Call to Action.md"
      - "Cards.md"
      - "Carousels and Sliders.md"
      - "Charts, Graphs and Maps.md"
      - "Chatbots.md"
      - "Client-side Routing.md"
      - "Colour, Contrast and Meaning.md"
      - "Comments.md"
      - "Customer Surveys and Feedback.md"
      - "Data Tables.md"
      - "Designing the Screen Reader Journey.md"
      - "Disclosure.md"
      - "Drag and Drop.md"
      - "Drawer.md"
      - "Dynamic Content.md"
      - "Expandable Content Previews.md"
      - "Filter and Sort.md"
      - "Focus.md"
      - "Forms.md"
      - "Functional Alternative Text.md"
      - "Global Navigation.md"
      - "HTML Form Elements.md"
      - "Headings.md"
      - "Icons.md"
      - "Infographics.md"
      - "Information Panels.md"
      - "Informed Choice and Preferences.md"
      - "Keyboard Navigation.md"
      - "Labels.md"
      - "Landmarks.md"
      - "Layout.md"
      - "Load More.md"
      - "Making Important Information Stand Out.md"
      - "Mega Menu.md"
      - "Metadata Strips.md"
      - "Modal Dialogs.md"
      - "Motion and Animation.md"
      - "Notifications and Status Messages.md"
      - "Page_Metadata.md"
      - "Page_Structure.md"
      - "Progressive Enhancement.md"
      - "Promotional Cards.md"
      - "README.md"
      - "Rating Stars.md"
      - "Refusal, Cancellation and Exit.md"
      - "Reminders and Saved Actions.md"
      - "Saving and Resuming a Task.md"
      - "Search.md"
      - "Share Tools.md"
      - "Showing What Changed Before Confirmation.md"
      - "Site Menus.md"
      - "Support, Escalation and Handoffs.md"
      - "Tabs.md"
      - "Typography.md"
      - "Video Controls.md"
      - "LICENSE"
      - "huggingface/export-config.json"
      - "huggingface/requirements.txt"
      - "huggingface/SETUP.md"
      - "scripts/sync_huggingface.py"
      - ".github/workflows/huggingface-sync.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-ux-design-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/Cosmos-UX-Design' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_DATASET_ID: GarethFW/Cosmos_UX_Design
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install publishing dependency
        run: python -m pip install -r huggingface/requirements.txt
      - name: Check fixed destination and validate export
        run: python scripts/sync_huggingface.py --mode check --dataset-id "$HF_DATASET_ID"
      - name: Build dataset files
        run: python scripts/sync_huggingface.py --mode build --output "$RUNNER_TEMP/cosmos-ux-design-dataset" --dataset-id "$HF_DATASET_ID"
      - name: Publish to the existing dataset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_huggingface.py --mode publish --folder "$RUNNER_TEMP/cosmos-ux-design-dataset" --dataset-id "$HF_DATASET_ID"
